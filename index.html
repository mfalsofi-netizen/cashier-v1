<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0652a5" />
  <title>كاشير-V1 | إدارة الطلبات وفاتورة الكاشير</title>
  <style>
    :root {
      --primary: #0652a5;
      --primary-light: #eef5fc;
      --accent: #f59e0b;
      --success: #15803d;
      --success-bg: #dcfce7;
      --warning: #b45309;
      --warning-bg: #fef3c7;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
    }

    .app-header {
      background: var(--primary);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 12px rgba(6, 82, 165, 0.25);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      gap: 10px;
    }

    .header-right-group, .header-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      font-size: 18px;
      font-weight: 700;
    }

    .header-title-wrap h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .header-title-wrap span {
      font-size: 11px;
      opacity: 0.9;
    }

    .currency-select {
      background: #ffffff;
      color: var(--primary);
      border: none;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 800;
      font-size: 13px;
    }

    .cart-badge {
      position: absolute;
      top: -6px;
      left: -6px;
      background: var(--accent);
      color: #0f172a;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--primary);
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 0 12px 10px;
    }

    .nav-tab {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .nav-tab.active {
      background: #ffffff;
      color: var(--primary);
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 14px 12px 48px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .card-header {
      background: var(--primary);
      color: #ffffff;
      padding: 10px 14px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-body { padding: 14px; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    .field-group { margin-bottom: 10px; }
    .field-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .input-control {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 13.5px;
      background: #ffffff;
      color: var(--text);
    }

    .input-control.invalid {
      border-color: var(--danger) !important;
      background: #fff5f5;
    }

    .item-box {
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 11px;
      margin-bottom: 10px;
      background: #f8fafc;
    }

    .item-box-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .btn-remove-item {
      background: var(--danger-bg);
      color: var(--danger);
      border: none;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-add-item {
      width: 100%;
      padding: 10px;
      border: 1.5px dashed var(--primary);
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 10px;
      font-weight: 800;
      font-size: 13.5px;
      cursor: pointer;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 720px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .summary-cell {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      padding: 10px;
    }

    .summary-cell.due-highlight {
      background: #fffbeb;
      border-color: #f59e0b;
    }

    .summary-label { font-size: 11.5px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .summary-value { font-size: 14px; font-weight: 800; }

    .profit-pill {
      display: inline-block;
      width: fit-content;
      background: #ffffff;
      color: var(--success);
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 800;
      margin-top: 4px;
    }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .btn {
      border: none;
      border-radius: 11px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: var(--primary); color: #ffffff; flex: 1; min-width: 140px; }
    .btn-success { background: var(--success); color: #ffffff; }
    .btn-warning { background: var(--accent); color: #0f172a; }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-outline { background: #ffffff; color: var(--text); border: 1.5px solid var(--border); }
    .btn-whatsapp { background: #16a34a; color: #ffffff; }

    .record-card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin: 8px 0;
    }

    .metric-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .metric-box .k { font-size: 11px; color: var(--muted); font-weight: 700; }
    .metric-box .v { font-size: 13.5px; font-weight: 800; margin-top: 2px; }

    .badge {
      display: inline-flex;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
    }
    .badge-paid { background: var(--success-bg); color: var(--success); }
    .badge-partial { background: var(--warning-bg); color: var(--warning); }
    .badge-unpaid { background: var(--danger-bg); color: var(--danger); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
    }

    .modal-header {
      background: var(--primary);
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
    }

    .modal-header h3 { margin: 0; font-size: 15px; font-weight: 800; }
    .modal-close {
      background: rgba(255,255,255,0.2);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .modal-body { padding: 15px; }

    #toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      z-index: 2000;
      transition: transform 0.25s ease;
      max-width: 92vw;
      text-align: center;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div class="header-right-group">
        <button type="button" class="icon-btn" id="menu-btn" aria-label="القائمة">☰</button>
        <div class="header-title-wrap">
          <h1>كاشير-V1</h1>
          <span id="header-store-sub">تطوير: مناف جلال</span>
        </div>
      </div>

      <div class="header-left-group">
        <select id="global-currency" class="currency-select" aria-label="العملة">
          <option value="SAR">SAR</option>
          <option value="YER">YER</option>
          <option value="USD">USD</option>
        </select>

        <button type="button" class="icon-btn" id="header-cart-btn" aria-label="سجل الطلبات">
          🛒
          <span class="cart-badge" id="completed-orders-badge">0</span>
        </button>
      </div>
    </div>

    <nav class="nav-tabs">
      <button type="button" class="nav-tab active" data-tab="new-order">+ طلب جديد</button>
      <button type="button" class="nav-tab" data-tab="orders-history">سجل الطلبات</button>
      <button type="button" class="nav-tab" data-tab="profit-reports">تقارير الأرباح</button>
    </nav>
  </header>

  <main class="container">
    <section id="tab-new-order" class="tab-panel active">
      <div class="card">
        <div class="card-header"><span>بيانات العميل</span></div>
        <div class="card-body">
          <div class="grid-2">
            <div class="field-group">
              <label for="customer-name">اسم العميل</label>
              <input type="text" id="customer-name" class="input-control" placeholder="مثال: أحمد محمد" />
            </div>
            <div class="field-group">
              <label for="customer-phone">رقم الهاتف (واتساب)</label>
              <input type="tel" id="customer-phone" class="input-control" placeholder="مثال: 967770000000" />
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span>الأصناف</span></div>
        <div class="card-body">
          <div id="items-container"></div>
          <button type="button" class="btn-add-item" id="add-item-btn">+ إضافة صنف جديد</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span>الشحن والمبالغ</span></div>
        <div class="card-body">
          <div class="grid-3">
            <div class="field-group">
              <label for="actual-shipping">تكلفة الشحن الفعلي</label>
              <input type="number" step="any" id="actual-shipping" class="input-control calc-trigger" placeholder="0.00" />
            </div>
            <div class="field-group">
              <label for="customer-shipping">الشحن على العميل</label>
              <input type="number" step="any" id="customer-shipping" class="input-control calc-trigger" placeholder="0.00" />
            </div>
            <div class="field-group">
              <label for="paid-amount">المبلغ المدفوع من العميل</label>
              <input type="number" step="any" id="paid-amount" class="input-control calc-trigger" placeholder="0.00" />
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span>ملخص الطلب</span></div>
        <div class="card-body">
          <div class="summary-grid">
            <div class="summary-cell">
              <div class="summary-label">إجمالي الفاتورة</div>
              <div class="summary-value" id="sum-total">0.00</div>
            </div>
            <div class="summary-cell due-highlight">
              <div class="summary-label">المطلوب من العميل</div>
              <div class="summary-value" id="sum-due">0.00</div>
            </div>
            <div class="summary-cell">
              <div class="summary-label">المدفوع / المتبقي</div>
              <div class="summary-value" id="sum-paid-rem" style="font-size:12.5px;">0.00 / 0.00</div>
            </div>
            <div class="summary-cell">
              <div class="summary-label">الربح</div>
              <div class="profit-pill" id="sum-profit">+0.00</div>
            </div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn-primary" id="save-order-btn">حفظ الطلب</button>
            <button type="button" class="btn btn-outline" id="clear-form-btn">تفريغ النموذج</button>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-orders-history" class="tab-panel">
      <div class="card">
        <div class="card-header"><span>سجل الطلبات والديون</span></div>
        <div class="card-body">
          <div id="orders-list"></div>
        </div>
      </div>
    </section>

    <section id="tab-profit-reports" class="tab-panel">
      <div class="card">
        <div class="card-header"><span>تقارير الأرباح والسيولة</span></div>
        <div class="card-body">
          <div id="profit-summary-box"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="jpg-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>صورة الفاتورة الجاهزة</h3>
        <button type="button" class="modal-close" id="close-jpg-modal">&times;</button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <p style="font-size:12.5px; font-weight:700; color:var(--primary);">اضغط مطولاً على الصورة لحفظها في الهاتف</p>
        <img id="jpg-preview-img" alt="فاتورة" style="max-width:100%; border-radius:10px; border:1px solid #cbd5e1;" />
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const KEY_ORDERS = 'cashier_v1_orders_live';
    const KEY_CUR = 'cashier_v1_cur_live';

    let state = {
      orders: [],
      currency: 'SAR'
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove('show'), 2600);
    }

    function fmt(n) {
      return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY_ORDERS) || '[]');
        if (Array.isArray(saved)) state.orders = saved;
        const c = localStorage.getItem(KEY_CUR);
        if (c && ['SAR', 'YER', 'USD'].includes(c)) state.currency = c;
      } catch (e) {}
      document.getElementById('global-currency').value = state.currency;
      updateBadge();
    }

    function saveData() {
      localStorage.setItem(KEY_ORDERS, JSON.stringify(state.orders));
      localStorage.setItem(KEY_CUR, state.currency);
      updateBadge();
    }

    function updateBadge() {
      document.getElementById('completed-orders-badge').textContent = state.orders.length;
    }

    function addItemRow() {
      const wrap = document.getElementById('items-container');
      const idx = wrap.children.length + 1;
      const div = document.createElement('div');
      div.className = 'item-box';
      div.innerHTML = `
        <div class="item-box-top">
          <strong class="item-title">صنف #${idx}</strong>
          <span>الإجمالي: <strong class="row-total">0.00</strong></span>
          <button type="button" class="btn-remove-item">حذف</button>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>اسم الصنف</label>
            <input type="text" class="input-control item-name" placeholder="اسم الصنف" />
          </div>
          <div class="field-group">
            <label>الكمية</label>
            <input type="number" step="any" class="input-control item-qty calc-trigger" placeholder="1" />
          </div>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>سعر التكلفة</label>
            <input type="number" step="any" class="input-control item-cost calc-trigger" placeholder="0.00" />
          </div>
          <div class="field-group">
            <label>سعر البيع</label>
            <input type="number" step="any" class="input-control item-price calc-trigger" placeholder="0.00" />
          </div>
        </div>
      `;

      div.querySelector('.btn-remove-item').addEventListener('click', () => {
        if (wrap.children.length <= 1) {
          showToast('يجب وجود صنف واحد على الأقل');
          return;
        }
        div.remove();
        [...wrap.children].forEach((el, i) => {
          el.querySelector('.item-title').textContent = `صنف #${i + 1}`;
        });
        recalc();
      });

      div.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          inp.classList.remove('invalid');
          recalc();
        });
      });

      wrap.appendChild(div);
      recalc();
    }

    function getMetrics() {
      let sub = 0, costSum = 0;
      const items = [];
      [...document.querySelectorAll('#items-container .item-box')].forEach((box, idx) => {
        const name = box.querySelector('.item-name').value.trim();
        const qtyRaw = box.querySelector('.item-qty').value;
        const costRaw = box.querySelector('.item-cost').value;
        const priceRaw = box.querySelector('.item-price').value;
        const qty = parseFloat(qtyRaw) || 0;
        const cost = parseFloat(costRaw) || 0;
        const price = parseFloat(priceRaw) || 0;
        const rowTotal = qty * price;
        box.querySelector('.row-total').textContent = fmt(rowTotal);
        sub += rowTotal;
        costSum += qty * cost;
        items.push({ index: idx + 1, name, qtyRaw, costRaw, priceRaw, qty, cost, price, total: rowTotal, box });
      });

      const actRaw = document.getElementById('actual-shipping').value;
      const custRaw = document.getElementById('customer-shipping').value;
      const paidRaw = document.getElementById('paid-amount').value;

      const actualShipping = parseFloat(actRaw) || 0;
      const customerShipping = parseFloat(custRaw) || 0;
      const paid = parseFloat(paidRaw) || 0;
      const total = sub + customerShipping;
      const remaining = Math.max(0, total - paid);
      const profit = (sub - costSum) + (customerShipping - actualShipping);

      return { items, actRaw, custRaw, actualShipping, customerShipping, paid, total, remaining, profit };
    }

    function recalc() {
      const m = getMetrics();
      const c = state.currency;
      document.getElementById('sum-total').textContent = `${fmt(m.total)} ${c}`;
      document.getElementById('sum-due').textContent = `${fmt(m.remaining)} ${c}`;
      document.getElementById('sum-paid-rem').textContent = `${fmt(m.paid)} / ${fmt(m.remaining)}`;
      document.getElementById('sum-profit').textContent = `${m.profit >= 0 ? '+' : ''}${fmt(m.profit)} ${c}`;
    }

    function failField(el, msg) {
      el.classList.add('invalid');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.focus();
      if (el.type === 'number' && el.select) el.select();
      showToast(msg);
      return false;
    }

    function saveOrder() {
      document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
      const m = getMetrics();

      for (const it of m.items) {
        if (!it.name) return failField(it.box.querySelector('.item-name'), `أدخل اسم الصنف في الصنف #${it.index}`);
        if (!it.qtyRaw || parseFloat(it.qtyRaw) <= 0) return failField(it.box.querySelector('.item-qty'), `أدخل كمية أكبر من صفر في الصنف #${it.index}`);
        if (!it.costRaw || parseFloat(it.costRaw) <= 0) return failField(it.box.querySelector('.item-cost'), `أدخل سعر تكلفة أكبر من صفر في الصنف #${it.index}`);
        if (!it.priceRaw || parseFloat(it.priceRaw) <= 0) return failField(it.box.querySelector('.item-price'), `أدخل سعر بيع أكبر من صفر في الصنف #${it.index}`);
      }

      const actEl = document.getElementById('actual-shipping');
      if (!m.actRaw || parseFloat(m.actRaw) <= 0) return failField(actEl, 'أدخل تكلفة الشحن الفعلي أكبر من صفر');

      const custEl = document.getElementById('customer-shipping');
      if (!m.custRaw || parseFloat(m.custRaw) <= 0) return failField(custEl, 'أدخل الشحن على العميل أكبر من صفر');

      const order = {
        id: 'ORD-' + Date.now(),
        orderNumber: '#' + (1001 + state.orders.length),
        createdAt: new Date().toISOString(),
        customerName: document.getElementById('customer-name').value.trim() || 'عميل نقدي',
        customerPhone: document.getElementById('customer-phone').value.trim(),
        currency: state.currency,
        items: m.items.map(x => ({ name: x.name, qty: x.qty, price: x.price, total: x.total })),
        customerShipping: m.customerShipping,
        total: m.total,
        paid: m.paid,
        remaining: m.remaining,
        profit: m.profit
      };

      state.orders.unshift(order);
      saveData();
      clearForm();
      renderOrders();
      renderReports();
      showToast(`تم حفظ الطلب ${order.orderNumber}`);
    }

    function clearForm() {
      document.getElementById('customer-name').value = '';
      document.getElementById('customer-phone').value = '';
      document.getElementById('actual-shipping').value = '';
      document.getElementById('customer-shipping').value = '';
      document.getElementById('paid-amount').value = '';
      document.getElementById('items-container').innerHTML = '';
      addItemRow();
      recalc();
    }

    function exportOrderJpg(order) {
      const canvas = document.createElement('canvas');
      canvas.width = 520;
      canvas.height = 360 + (order.items.length * 32);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'right';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('كاشير-V1', canvas.width - 24, 38);
      ctx.font = '15px sans-serif';
      let y = 74;
      ctx.fillText(`فاتورة: ${order.orderNumber} | العميل: ${order.customerName}`, canvas.width - 24, y); y += 28;
      order.items.forEach(it => {
        ctx.fillText(`${it.name} (${it.qty} × ${fmt(it.price)}) = ${fmt(it.total)}`, canvas.width - 24, y);
        y += 28;
      });
      y += 10;
      ctx.fillText(`الشحن: ${fmt(order.customerShipping)} ${order.currency}`, canvas.width - 24, y); y += 28;
      ctx.fillText(`الإجمالي: ${fmt(order.total)} ${order.currency}`, canvas.width - 24, y); y += 28;
      ctx.fillText(`المدفوع: ${fmt(order.paid)} | المتبقي: ${fmt(order.remaining)} ${order.currency}`, canvas.width - 24, y);
      const url = canvas.toDataURL('image/jpeg', 0.92);
      document.getElementById('jpg-preview-img').src = url;
      document.getElementById('jpg-modal').classList.add('open');
    }

    function renderOrders() {
      const list = document.getElementById('orders-list');
      if (!state.orders.length) {
        list.innerHTML = '<p style="text-align:center; color:var(--muted);">لا توجد طلبات محفوظة بعد</p>';
        return;
      }
      list.innerHTML = state.orders.map(o => {
        const badge = o.remaining <= 0.0001
          ? '<span class="badge badge-paid">مدفوعة</span>'
          : (o.paid > 0 ? `<span class="badge badge-partial">جزئية — متبقي: ${fmt(o.remaining)} ${o.currency}</span>` : `<span class="badge badge-unpaid">آجل — متبقي: ${fmt(o.remaining)} ${o.currency}</span>`);
        return `
          <div class="record-card">
            <div class="record-top">
              <div><strong>${o.orderNumber}</strong> — ${o.customerName}</div>
              ${badge}
            </div>
            <div class="metrics-grid">
              <div class="metric-box"><div class="k">الإجمالي</div><div class="v">${fmt(o.total)} ${o.currency}</div></div>
              <div class="metric-box"><div class="k">المدفوع</div><div class="v">${fmt(o.paid)} ${o.currency}</div></div>
              <div class="metric-box"><div class="k">المتبقي</div><div class="v">${fmt(o.remaining)} ${o.currency}</div></div>
              <div class="metric-box"><div class="k">الربح</div><div class="v">${o.profit >= 0 ? '+' : ''}${fmt(o.profit)} ${o.currency}</div></div>
            </div>
            <div class="btn-row">
              <button type="button" class="btn btn-success" onclick="exportOrderJpgById('${o.id}')">صورة JPG</button>
              <button type="button" class="btn btn-danger" onclick="deleteOrder('${o.id}')">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function exportOrderJpgById(id) {
      const o = state.orders.find(x => x.id === id);
      if (o) exportOrderJpg(o);
    }

    function deleteOrder(id) {
      state.orders = state.orders.filter(x => x.id !== id);
      saveData();
      renderOrders();
      renderReports();
      showToast('تم حذف الطلب');
    }

    function renderReports() {
      const box = document.getElementById('profit-summary-box');
      if (!state.orders.length) {
        box.innerHTML = '<p style="text-align:center; color:var(--muted);">لا توجد بيانات أرباح بعد</p>';
        return;
      }
      const stats = {};
      state.orders.forEach(o => {
        const c = o.currency || 'SAR';
        if (!stats[c]) stats[c] = { collected: 0, pending: 0, due: 0 };
        if (o.remaining <= 0.0001) stats[c].collected += Number(o.profit) || 0;
        else {
          stats[c].pending += Number(o.profit) || 0;
          stats[c].due += Number(o.remaining) || 0;
        }
      });
      box.innerHTML = Object.keys(stats).map(c => `
        <div class="record-card">
          <strong>العملة: ${c}</strong>
          <div class="metrics-grid">
            <div class="metric-box"><div class="k">ربح محصّل</div><div class="v" style="color:var(--success);">${fmt(stats[c].collected)} ${c}</div></div>
            <div class="metric-box"><div class="k">ربح معلّق</div><div class="v" style="color:var(--warning);">${fmt(stats[c].pending)} ${c}</div></div>
            <div class="metric-box"><div class="k">متبقي عند العملاء</div><div class="v" style="color:var(--danger);">${fmt(stats[c].due)} ${c}</div></div>
          </div>
        </div>
      `).join('');
    }

    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('header-cart-btn').addEventListener('click', () => {
      document.querySelector('.nav-tab[data-tab="orders-history"]').click();
    });

    document.getElementById('global-currency').addEventListener('change', (e) => {
      state.currency = e.target.value;
      saveData();
      recalc();
    });

    document.querySelectorAll('.calc-trigger').forEach(el => el.addEventListener('input', recalc));
    document.getElementById('add-item-btn').addEventListener('click', addItemRow);
    document.getElementById('save-order-btn').addEventListener('click', saveOrder);
    document.getElementById('clear-form-btn').addEventListener('click', clearForm);
    document.getElementById('close-jpg-modal').addEventListener('click', () => {
      document.getElementById('jpg-modal').classList.remove('open');
    });

    loadData();
    addItemRow();
    renderOrders();
    renderReports();
  </script>
</body>
</html>
